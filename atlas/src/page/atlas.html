<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>atlas</title>
<!--
  The page of the atlas engine: an architecture map, one container's view at
  a time, at any depth. The engine's files and traps: atlas/AGENTS.md.

  The markup holds no word and no colour of a map: engine.ts writes the
  title, the subtitle, the page's own words (words.ts, in the Config's
  `lang`), the legend's lines and the palette's custom properties from the
  map folder's atlas.config.ts before the first layout.

  A local page, served by serve.ts (see "Check" below); never published.

  Purpose: understand the architecture, improve it easily, and swap a
  component when needed. Every brick therefore answers: what it receives and
  produces (`io`), what to touch to replace it (`swap`), which bricks change
  with it (`couples`, a dashed blue outline on the map), how to extend it
  (`extend`) and its traps (`pitfalls`). When the Config's `tags` require it,
  every arrow into a third-party service names the tags it carries.
  Addresses and secrets are left out on purpose: no IP, no secret value.

  How the map works:
  - No position or size is written anywhere: ELK (elkjs) lays each view out
    when the reader reaches it, and libavoid routes its arrows. Nothing
    overlaps.
  - A view shows the children of the open container: a container child as a
    box listing its own children as chips, a leaf child as a card with its
    subtitle. The page opens on the root's view, where an outside child
    stands in the column of its `side`. One arrow per pair of boxes, each
    link's ends lifted to the boxes that hold them; the links that leave the
    open container bring their other end as a ghost at the edge, on the left
    when the arrow comes from it, on the right when it goes to it; a ghost
    reached both ways is drawn twice, a mark at the edge its arrows cross. A
    view of leaves alone is laid out left to right, its rows wrapped to the
    stage's aspect, every arrow's label and tags placed along it, shortened
    with its whole text as a tooltip where nothing else fits.
  - An arrow's label, a box's tag or a card's sub-title under 10 px on
    screen hides until a zoom brings it to 10 px; an arrow's label also shows
    while hovering, focusing or selecting an item lights its arrow, and a
    box's tag or a card's sub-title while its own item is hovered, focused
    or selected. An invisible band 8 px wide along each arrow keeps its
    whole text as a tooltip.
  - Clicking a box enters it: the camera carries the reader from the box
    into the child's view, the two cross-fading on the way; Escape, the
    breadcrumb or a click on the empty sheet go up one level (Escape first
    deselects). Inside a view, the wheel zooms around the pointer, a drag
    pans and two fingers pinch; the fit button, Escape or a click on the
    empty sheet bring the fit back first (zoom.ts). The camera follows
    navigation (navigation.ts, camera.ts): another view starts at its fit.
  - Clicking a card, a ghost or a chip selects it, lights its arrows and
    outlines its couplings, lifted to the boxes and ghosts of the view.
    Couplings are symmetric: listing B in A's `couples` also outlines A when
    B is selected.
  - A view with two leaf children or more, one of them with an `io`, gets a
    switch in its controls: its leaves as cards side by side, a column each,
    a row of leads unless none has one, then a row per first element of
    their `io` pairs; a column's header selects its leaf, a marker in a cell
    shows its lines in the panel, shown if hidden. Over the cards, Escape
    leaves the drawing's zoom alone. Another container opens on its drawing.
  - The panel on the right renders the fields of the selection, or of the
    open container, under the headings of the Config's `headings` or the
    dictionary. A `<cite>path:lines</cite>` shows as a small marker of its
    lines, the whole citation as its tooltip; the header's Sources toggle,
    remembered per browser, shows every citation in full. With the Config's
    `sources` root, a click on a marker shows the cited lines in the panel,
    read from serve.ts, until its close button or a move.
  - A bare #id in the link opens the page on it: a container's view, or a
    leaf's parent's view with the leaf selected.
  - The legend shows a line for each arrow kind and node mark the view uses,
    labelled by the Config's `legend` or the dictionary.
  - Open points: a node with an `open` entry carries a badge counting the
    open points of its subtree, as does every box and chip that holds it. The
    header button, with their count, lists them all, with the party each
    waits for; a row opens its node. The panel shows each point's id, text
    and thread, and a one-line reply form that posts to serve.ts as human,
    with the token serve.ts wrote into the page: the server refuses a write
    from any other page. The page reads threads.json again when its window
    regains focus, so a reply from the terminal shows up.

  Open points and threads (the field notes are on the types of atlas.ts):
  - An open point is { id, text } in a node's `open`; its thread is the list
    under the same id in threads.json, [{ "who": "human" | "agent",
    "text" }], without a date: git keeps the history.
  - A point waits for the party that did not write the last entry; a point
    without a thread waits for nobody.
  - Read them in the terminal: bun atlas/src/cli.ts check <map folder> --open
  - Answer: bun atlas/src/cli.ts reply <map folder> <id> --as agent "<text>". An
    agent always writes as agent; the human answers from the panel or with
    --as human.
    An unknown id is refused.
  - A settled point: delete its `open` entry and its thread together.

  Edit recipes (the fields are documented on the types of atlas.ts), in the
  map folder (map.ts, atlas.config.ts, threads.json; the sample's is
  atlas/fixtures/sample). Its atlas.d.ts and tsconfig.json come from the
  plugin: bun atlas/src/cli.ts sync <map folder> rewrites them, never edit them,
  and adds drafts/ to its .gitignore.
  - A new map: bun atlas/src/cli.ts new <dir>, then replace its placeholder
    nodes.
  - A change to try before it counts: bun atlas/src/cli.ts draft <map folder>
    <name> copies the map's own files into drafts/<name> and prints that
    path; edit and check the draft there, then the same command with
    --adopt copies the draft's data files (its .ts files but atlas.d.ts)
    and threads.json over the map's and deletes the draft, or with --drop
    deletes it. --adopt refuses while the map's own copies of those files
    differ from those the draft started from.
  - Add a leaf: a node without `children` in the `children` of its container
    (map.ts); then its links (with `tags` from the Config's list, required
    when the link enters a third-party service and the Config says so) and
    its `couples`.
  - Retire a node: delete it, its links, and its id from every `couples`,
    `see`, `seams` and `traps` list (check finds leftovers).
  - Add a container: a node with `children` in the `children` of its parent,
    at any depth; the tour follows the tree, unless the root lists a `tour`.
  - Name the arrow between two boxes: a link between those two nodes, in the
    `links` of map.ts; it names the arrow in every view where the two stand
    apart.
  - A new colour: a key of the palette in atlas.config.ts, with its light
    and dark values.

  Check, from the repository root:
  1. bun install --cwd atlas --frozen-lockfile, once.
  2. bun atlas/src/cli.ts check <map folder>: the map (ids, couplings, nesting,
     tags, open points, threads.json, and each citation's file and lines under
     the Config's `sources` root), then tsgo, oxlint and oxfmt on its
     data files, then its atlas.d.ts and tsconfig.json against the plugin's
     (stale or edited: bun atlas/src/cli.ts sync <map folder>). It exits 1 on
     any failure; bun atlas/src/cli.ts fmt <map folder> fixes what oxfmt
     reports. Then bun test atlas and the repository's gates.
  3. Look at the page: bun atlas/src/serve.ts <map folder> [port] and open the
     address it prints. It rebuilds on every save in the map folder or the
     engine, and reloads the open tab when the page changed; a build error,
     or a map the engine cannot draw, shows an error page until the next
     good save. Look at the root's view and at the container you changed.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a zoomable drawing sheet (inline SVG, two levels) beside a reading panel; stacked on phones. */
:root {
  --bg: #e9edf1;
  --sheet: #f6f8fa;
  --surface: #ffffff;
  --ink: #18222f;
  --ink-2: #4f5d70;
  --ink-3: #7a8798;
  --line: #c3ccd7;
  --grid: rgba(24, 34, 47, 0.06);
  --grid-major: rgba(24, 34, 47, 0.10);
  --accent: #2d5fc4;
  --ok: #1e7a4c;
  --deny: #b83246;
  --open: #c2410c;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131b; --sheet: #121a24; --surface: #18222f; --ink: #e2e8ef; --ink-2: #a3b0c0; --ink-3: #75839a;
    --line: #2f3d50; --grid: rgba(226, 232, 239, 0.04); --grid-major: rgba(226, 232, 239, 0.08);
    --accent: #7fa6f5; --ok: #5cc28d; --deny: #f07a8b; --open: #fb923c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131b; --sheet: #121a24; --surface: #18222f; --ink: #e2e8ef; --ink-2: #a3b0c0; --ink-3: #75839a;
  --line: #2f3d50; --grid: rgba(226, 232, 239, 0.04); --grid-major: rgba(226, 232, 239, 0.08);
  --accent: #7fa6f5; --ok: #5cc28d; --deny: #f07a8b; --open: #fb923c;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  display: flex; flex-direction: column;
  margin: 0; padding-inline: 16px; padding-block: 0 12px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }

.top {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px;
  padding-block: 14px 10px;
}
.top h1 {
  margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 30px;
  letter-spacing: 0.02em; line-height: 1;
}
.top .sub { margin: 0; color: var(--ink-2); font-size: 13.5px; }
/* One line: the levels between the root and the last two fold into "…" (panel.ts), and a long label is cut with its whole text as a tooltip. */
.crumbs {
  margin-left: auto; display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; min-width: 0; white-space: nowrap;
  font-family: var(--f-display); font-size: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
}
.crumbs button {
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink-2);
  background: none; border: 0; padding: 2px 4px; cursor: pointer; border-radius: 3px;
  max-width: 22ch; overflow: hidden; text-overflow: ellipsis;
}
.crumbs button:hover { color: var(--accent); }
.crumbs button[aria-current="true"] { color: var(--ink); cursor: default; }
.crumbs .sep, .crumbs .fold { color: var(--ink-3); }
.crumbs .fold { padding: 2px 4px; cursor: help; }

/* Open points: the header button, its list (a native popover), and the badge on the map. */
.open-btn, .sources-btn {
  font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: 0.04em; line-height: 1.2;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--open);
  border-radius: 4px; padding: 4px 10px; cursor: pointer; align-self: center;
}
/* The toggle that shows each citation of the panel in full (engine.ts); the page drops it for a map without citations. */
.sources-btn { color: var(--ink-3); border-left: 1px solid var(--line); }
.open-btn:hover, .sources-btn:hover { border-color: var(--accent); color: var(--accent); }
.sources-btn[aria-pressed="true"] { color: var(--ink); }
.open-list {
  position: fixed; inset: 60px 16px auto auto; margin: 0; width: min(620px, calc(100vw - 32px)); max-height: 72vh; overflow-y: auto;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
}
.open-list h2 { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0 0 2px; }
.open-list .open-sum { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.open-list ul { list-style: none; margin: 0; padding: 0; }
.open-row {
  display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 2px 12px; width: 100%; text-align: left;
  font: inherit; font-size: 13.5px; color: var(--ink); background: none; border: 0; border-top: 1px solid var(--line);
  padding: 7px 4px; cursor: pointer;
}
.open-row:hover { background: var(--sheet); }
.open-row code { font-family: var(--f-mono); font-size: 12px; color: var(--ink); }
.open-row .open-wait { font-size: 12px; color: var(--ink-2); text-align: right; }
.open-row .open-owner { font-size: 12px; color: var(--ink-3); margin-left: 6px; }
.open-row .open-line { grid-column: 1 / -1; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px;
}
.stage {
  position: relative; min-width: 0; min-height: 0; container: stage / inline-size;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
}
.sheet { height: 100%; }
/* touch-action none: the page keeps a finger's drag and a pinch for its own pan and zoom. */
#map { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; touch-action: none; }

/* The controls wrap within the stage rather than run past its edge; engine.ts hands the cards their bottom (--controls-bottom). */
.controls { position: absolute; top: 10px; left: 10px; max-width: calc(100% - 20px); display: flex; flex-wrap: wrap; gap: 6px; }
.controls button { white-space: nowrap; }
.controls button, .panel .nav button, .chip {
  font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: 0.04em;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: 4px 10px; cursor: pointer; line-height: 1.2;
}
.controls button:hover, .panel .nav button:hover, .chip:hover { border-color: var(--accent); color: var(--accent); }
button:focus-visible, .hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend {
  position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 10px; font-size: 12px; color: var(--ink-2); max-width: calc(100% - 20px);
}
.legend[hidden], .legend.empty, .panel[hidden] { display: none; }
.app:has(> .panel[hidden]) { grid-template-columns: minmax(0, 1fr); }
.controls button[aria-pressed="false"], .controls button:disabled { color: var(--ink-3); }
.controls button:disabled { cursor: default; border-color: var(--line); }
/* The switch between the drawing and the cards, shown where the open container has cards (cardsOf). */
.controls .mode { display: flex; }
.controls .mode[hidden] { display: none; }
.controls .mode button:first-child { border-radius: 4px 0 0 4px; }
.controls .mode button:last-child { border-radius: 0 4px 4px 0; margin-left: -1px; }
.stage:has(.mode:not([hidden])) .hint { max-width: calc(100% - 560px); }
/* The hint keeps the stage's right of the controls; where that leaves it under 200 px, it hides rather than cover them. */
@container stage (width < 640px) { .hint { display: none; } }
@container stage (width < 760px) { .stage:has(.mode:not([hidden])) .hint { display: none; } }

/* The cards (panel.ts's cardsHtml): a container's leaves side by side, over the drawing, which stays laid out beneath; the legend and the hint, which read the drawing, hide.
   The top and left borders, outside the scrolled box, keep the controls' band and the margin: the header row sticks below the one, the row keys' column beside the other, its shadow covering the gap after it. */
.cards {
  position: absolute; inset: 0; overflow: auto; padding: 0 16px 16px 0; background: var(--sheet);
  border: 0 solid var(--sheet); border-width: calc(var(--controls-bottom, 40px) + 12px) 0 0 16px;
}
.cards[hidden] { display: none; }
.stage:has(> .cards:not([hidden])) :is(.legend, .hint) { display: none; }
.cards table { border-collapse: separate; border-spacing: 8px 0; font-size: 14px; line-height: 1.45; }
.cards th, .cards td { text-align: left; vertical-align: top; padding: 8px 12px; }
.cards thead > tr > * { position: sticky; top: 0; z-index: 1; }
.cards tr > :first-child { position: sticky; left: 0; z-index: 1; background: var(--sheet); box-shadow: 8px 0 0 var(--sheet); }
.cards thead > tr > :first-child { z-index: 2; }
.cards td:not(:first-child) { background: var(--surface); border-inline: 1px solid var(--line); width: 280px; min-width: 220px; }
.cards thead th { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--zc); border-bottom: 0; border-radius: 6px 6px 0 0; padding-block: 10px 4px; }
.cards td.selected, .cards th.selected { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border-inline-color: var(--accent); }
.cards tbody tr:last-child td.selected { border-bottom-color: var(--accent); }
.cards thead th.selected { border-top-color: var(--zc); }
.cards thead button {
  font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.05; letter-spacing: 0.01em; text-align: left;
  color: var(--zc); background: none; border: 0; padding: 0; cursor: pointer;
}
.cards thead button:hover { text-decoration: underline; }
.cards tbody th { font-weight: 400; color: var(--ink-2); white-space: nowrap; border-top: 1px solid var(--line); }
.cards tbody tr:not(:first-child) td:not(:first-child) { border-top: 1px solid var(--line); }
.cards tbody tr:last-child td:not(:first-child) { border-bottom: 1px solid var(--line); border-radius: 0 0 6px 6px; }
.cards .lead { font-size: 15px; }
.cards td p { margin: 0 0 6px; }
.cards td p:last-child { margin-bottom: 0; }
.cards code { font-family: var(--f-mono); font-size: 0.86em; background: var(--sheet); padding: 1px 4px; border-radius: 3px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 26px; height: 8px; overflow: visible; }
.hint {
  position: absolute; right: 10px; top: 12px; margin: 0; font-size: 12px; color: var(--ink-3);
  max-width: calc(100% - 440px); text-align: right;
  background: color-mix(in srgb, var(--sheet) 85%, transparent); padding: 2px 6px; border-radius: 3px;
}

.panel {
  min-width: 0; min-height: 0; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 18px 20px 22px;
}
.panel .kicker {
  font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin: 0 0 6px; word-break: break-all;
}
.panel h2 {
  font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.05; letter-spacing: 0.01em;
  margin: 0 0 10px; text-wrap: balance; display: flex; align-items: center; gap: 10px;
}
.panel h2 .swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; background: var(--zc, var(--ink-3)); }
.panel h3 {
  font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-2); margin: 18px 0 6px;
}
.panel p { margin: 0 0 8px; }
.panel .lead { font-size: 15.5px; }
.panel ul { margin: 0; padding-left: 18px; }
.panel li { margin-bottom: 6px; }
.panel li::marker { color: var(--zc, var(--ink-3)); }
.panel code { font-family: var(--f-mono); font-size: 0.86em; background: var(--sheet); padding: 1px 4px; border-radius: 3px; }
.panel .alt { color: var(--ink-2); }
/* A citation (citations.ts, panel.ts), in the panel or the cards: a small mono marker of its lines, its path shown once the Sources toggle shows them in full. */
.panel cite.cite, .cards cite.cite {
  font-style: normal; font-family: var(--f-mono); font-size: 11px; line-height: 1.3; color: var(--ink-3); white-space: nowrap;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; vertical-align: 1px;
}
.panel .cite-path, .cards .cite-path { display: none; }
.panel.full-sources .cite-path, .cards.full-sources .cite-path { display: inline; white-space: normal; overflow-wrap: anywhere; }
/* With the Config's sources root, a marker is a button that opens its lines in the panel. */
.panel .cite-open, .cards .cite-open { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.panel cite.cite:has(.cite-open:hover), .cards cite.cite:has(.cite-open:hover) { border-color: var(--accent); color: var(--accent); }
/* The lines a marker cites, in place of the panel's fields: the path and the close button above, the cited lines marked. */
.panel .viewer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px; }
.panel .viewer-path { font-size: 12.5px; background: none; padding: 0; overflow-wrap: anywhere; }
.panel .viewer-close {
  flex: none; font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: 0.04em; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer;
}
.panel .viewer-close:hover { border-color: var(--accent); color: var(--accent); }
.panel .viewer-note { color: var(--ink-3); font-size: 13px; }
.panel .viewer-lines {
  font-family: var(--f-mono); font-size: 12px; line-height: 1.6;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 6px 0;
}
/* A long line wraps in the panel, its number on its first row. */
.panel .viewer-lines .line { display: flex; min-height: 1.6em; }
.panel .viewer-lines .n { flex: none; width: 5ch; padding-right: 10px; text-align: right; color: var(--ink-3); user-select: none; }
.panel .viewer-lines code {
  flex: 1; min-width: 0; font-size: inherit; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4;
  background: none; padding: 0 12px 0 0; border-radius: 0;
}
.panel .viewer-lines .cited { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.panel .viewer-lines .cited .n { color: var(--accent); }
.panel .warn {
  border-left: 3px solid var(--open); padding: 6px 10px; background: var(--sheet); border-radius: 0 4px 4px 0; font-size: 14px;
}
.panel .open-point { margin-bottom: 14px; }
.panel .open-id { font-size: 12.5px; color: var(--ink-2); margin: 0 0 4px; }
.panel .thread { list-style: none; margin: 6px 0; padding: 0 0 0 13px; font-size: 14px; }
.panel .thread li { margin-bottom: 4px; }
.panel .thread .who { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin-right: 4px; }
.panel .reply { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.panel .reply input {
  flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--sheet);
  border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px;
}
.panel .reply input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.panel .reply button {
  font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: 0.04em; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer;
}
.panel .reply button:hover { border-color: var(--accent); color: var(--accent); }
.panel .reply button:disabled { color: var(--ink-3); cursor: wait; }
.reply-error { color: var(--deny); font-size: 13px; margin: 4px 0 0; flex-basis: 100%; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 14px; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 14px; padding: 3px 9px; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--zc, var(--ink-3)); }
.panel .points { list-style: none; padding: 0; }
.panel .points li { margin-bottom: 10px; }
.panel .points .chip { margin-top: 4px; }
.panel .label { font-size: 13px; color: var(--ink-2); margin: 10px 0 6px; }
.facts.io dd { font-family: var(--f-body); font-size: 14px; }
.panel .src { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin-top: 16px; overflow-wrap: anywhere; }
.panel .nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }

/* SVG. Sizes are in world units, so text grows with the zoom. measure.ts measures the text
   classes it lays out (CARD, CHIP, BOX, GHOST and LABEL there): their font sizes here must match.
   Borders keep a constant screen width (non-scaling-stroke), otherwise a zoomed-in box gets a
   thick border. engine.ts sets each view's opacity, visibility and alignment frame by frame. */
/* Text keeps the width measure.ts measured at every zoom; without it, Chrome rounds font sizes per zoom. */
svg text { text-rendering: geometricPrecision; }
.hit { cursor: pointer; }
.box.hit { cursor: zoom-in; }

/* A container child: a box naming its own children as chips. */
.box-bg { fill: color-mix(in srgb, var(--zc) 9%, var(--surface)); stroke: color-mix(in srgb, var(--zc) 30%, transparent); stroke-width: 1; vector-effect: non-scaling-stroke; }
.box.outside .box-bg { fill: color-mix(in srgb, var(--zc) 4%, var(--sheet)); stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 7 5; }
.box:hover .box-bg { stroke: var(--zc); stroke-width: 2.4; }
.box.selected .box-bg { stroke: var(--accent); stroke-width: 2.4; }
.box.coupled .box-bg { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 3; }
.box-title { font-family: var(--f-display); font-weight: 700; font-size: 27px; letter-spacing: 0.06em; text-transform: uppercase; fill: var(--zc); }
.box-tag { font-family: var(--f-mono); font-size: 13px; fill: var(--ink-2); }
.chip rect { fill: var(--surface); stroke: color-mix(in srgb, var(--zc) 55%, var(--line)); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chip.off rect { stroke-dasharray: 4 3; fill: var(--sheet); }
.chip:hover rect { stroke: var(--zc); stroke-width: 2; }
.chip.selected rect { stroke: var(--accent); stroke-width: 2.4; }
.chip.coupled rect { stroke: var(--accent); stroke-dasharray: 4 3; fill: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.chip-t { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: 0.02em; fill: var(--ink); }
.chip.off .chip-t { fill: var(--ink-2); }

/* A leaf child: a card with its subtitle; .outside = a child of the root outside the system, .off = dormant. */
.card rect { fill: var(--surface); stroke: color-mix(in srgb, var(--zc) 55%, var(--line)); stroke-width: 1; vector-effect: non-scaling-stroke; }
.card.outside rect { stroke: var(--ink-3); stroke-width: 1.4; stroke-dasharray: 6 4; }
.card.off rect { stroke-dasharray: 4 3; fill: var(--sheet); }
.card:hover rect { stroke: var(--zc); stroke-width: 2; }
.card.selected rect { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: none; }
.card.coupled rect { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 3; fill: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.card-lbl { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: 0.02em; fill: var(--ink); }
.card-sub { font-family: var(--f-mono); font-size: 11px; fill: var(--ink-2); }
.card.off .card-lbl { fill: var(--ink-2); }

/* A ghost: a neighbour outside the open container, at the edge; .outside = outside the system. */
.ghost rect { fill: color-mix(in srgb, var(--zc) 5%, var(--sheet)); stroke: color-mix(in srgb, var(--zc) 45%, var(--ink-3)); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.ghost.outside rect { stroke: var(--ink-3); stroke-width: 1.4; stroke-dasharray: 6 4; }
.ghost.off rect { stroke-dasharray: 4 3; fill: var(--sheet); }
.ghost:hover rect, .ghost.peer rect { stroke: var(--ink); }
.ghost.selected rect { stroke: var(--accent); stroke-width: 2.6; stroke-dasharray: none; }
.ghost.coupled rect { stroke: var(--accent); stroke-dasharray: 4 3; fill: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.ghost-t { font-family: var(--f-display); font-weight: 600; font-size: 20px; fill: var(--ink-2); }
/* The mark of a ghost drawn twice: at the edge its arrows leave ("in" copy) or reach ("out" copy). */
.ghost-mark { font-family: var(--f-display); font-weight: 700; font-size: 22px; fill: var(--ink-3); pointer-events: none; }
.ghost:hover .ghost-mark, .ghost.peer .ghost-mark { fill: var(--ink); }

/* The badge of an item whose subtree carries open points, with their count. */
.open-dot { fill: var(--open); stroke: var(--surface); stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.open-count { font-family: var(--f-display); font-weight: 700; font-size: 12px; fill: #fff; pointer-events: none; }
.open-badge.small .open-count { font-size: 10px; }

/* Arrows rest faded in a packed view and full in a layered one; a hovered item (.focusing) or a
   selected node (.selecting) lights its own (.lit, .hot) and fades the rest. */
.flow { transition: opacity 120ms ease-out; }
.view.packed .flow { opacity: 0.3; }
.view.focusing .flow, .view.selecting .flow { opacity: 0.12; }
.view .flow.lit, .view .flow.hot { opacity: 1; }
.flow.lit path { stroke: var(--ink); }
.flow.lit .flow-label { fill: var(--ink); }
.flow path { fill: none; stroke: var(--ink-3); stroke-width: 2.2; }
.view.layered .flow path { stroke-width: 1.8; }
.flow.deny path { stroke: var(--deny); }
.flow.dash path { stroke-dasharray: 6 5; }
.flow.hot path { stroke: var(--accent); stroke-width: 3.2; }
/* An arrow's hit band (draw.ts): invisible, 8 px wide on screen at any zoom. It keeps the
   pointer-events its view's layer inherits, so a fading view's bands catch nothing. */
.flow-hit { fill: none; stroke: transparent; stroke-width: 8px; vector-effect: non-scaling-stroke; }
.flow-label { font-family: var(--f-mono); font-size: 14px; fill: var(--ink-2); paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; stroke-linejoin: round; }
/* A caption too small to read on screen (engine.ts): hidden, its spot kept, never set visible here, or it would show through a hidden view. */
svg text.illegible { visibility: hidden; }
.flow.deny .flow-label { fill: var(--deny); }
.flow.hot .flow-label { fill: var(--accent); }
.arrowhead { fill: var(--ink-3); }
.arrowhead.deny { fill: var(--deny); }
.arrowhead.hot { fill: var(--accent); }

@media (max-width: 860px) {
  html, body { height: auto; }
  body { display: block; }
  .app { display: flex; flex-direction: column; }
  .stage { height: 64vh; min-height: 360px; }
  .panel { overflow: visible; }
  .crumbs { margin-left: 0; width: 100%; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<header class="top">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <button type="button" class="open-btn" id="btn-open" popovertarget="open-list"></button>
  <div class="open-list" id="open-list" popover></div>
  <button type="button" class="sources-btn" id="btn-sources" aria-controls="panel cards" aria-pressed="false"></button>
  <nav class="crumbs" id="crumbs"></nav>
</header>

<main class="app">
  <section class="stage" id="stage">
    <!-- The drawing's own box: inert under the cards, which an SVG element alone cannot be. -->
    <div class="sheet" id="sheet">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="group"></svg>
    </div>
    <div class="cards" id="cards" hidden></div>

      <button type="button" id="btn-home"></button>
