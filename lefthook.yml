pre-commit:
  piped: true
  jobs:
    - name: block-commit-to-main
      priority: 0
      run: bun ./.claude/git/block-commit-to-main.ts
    - name: block-settings-json
      priority: 1
      glob: ".claude/settings.json"
      run: ./.claude/git/block-settings-json.sh
    - name: sync-settings
      priority: 1
      glob: ".claude/__settings.jsonc"
      run: |
        ./.claude/scripts/settings-sync.sh
        git add .claude/settings.json
    - name: sync-versions
      glob: "*/.claude-plugin/plugin.json"
      run: ./scripts/sync-versions.ts
    - name: validate-marketplace
      glob:
        - ".claude-plugin/*.json"
        - "*/.claude-plugin/*.json"
      run: ./scripts/validate-marketplace.ts
    - name: validate-frontmatter
      glob:
        - "*/commands/*.md"
        - "*/skills/*.md"
        - "*/skills/*/*.md"
        - "*/agents/*.md"
        - "*/hooks/*.md"
        - ".claude/commands/*.md"
        - ".claude/skills/*.md"
      run: bun ./scripts/validate-frontmatter.ts

    # The five gates below run over the whole repo, not the staged subset: each
    # takes well under a second, and CI then replays the exact same commands.
    - name: typecheck
      glob:
        - "*.ts"
        - "tsconfig.json"
      run: bun x tsgo --noEmit
    - name: lint-ts
      glob:
        - "*.ts"
        - "*.js"
        - "oxlint.config.ts"
      run: bun x oxlint
    - name: fmt
      glob:
        - "*.ts"
        - "*.js"
        - ".oxfmtrc.json"
      run: bun x oxfmt --check '**/*.ts' '**/*.js'
    - name: lint-sh
      glob:
        - "*.sh"
        - "*/scripts/*"
        - "*/hooks/*"
        - ".claude/git/*"
      run: bun ./scripts/lint-shell.ts
    - name: check-lint-disables
      glob:
        - "*.ts"
        - "*.js"
      run: bun ./scripts/check-lint-disables.ts

commit-msg:
  jobs:
    - name: block-ai-signatures
      run: ./.claude/git/block-ai-signatures.sh {1}
