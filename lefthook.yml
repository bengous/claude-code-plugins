pre-commit:
  piped: true
  jobs:
    - name: block-commit-to-main
      priority: 0
      run: bun ./.claude/git/block-commit-to-main.ts
    - name: block-settings-json
      priority: 1
      glob: ".claude/settings.json"
      run: ./.claude/git/block-settings-json.sh
    - name: sync-settings
      priority: 1
      glob: ".claude/__settings.jsonc"
      run: |
        ./.claude/scripts/settings-sync.sh
        git add .claude/settings.json
    - name: sync-versions
      glob: "*/.claude-plugin/plugin.json"
      run: ./scripts/sync-versions.ts
    - name: validate-marketplace
      glob:
        - ".claude-plugin/*.json"
        - "*/.claude-plugin/*.json"
      run: ./scripts/validate-marketplace.ts
    - name: validate-frontmatter
      glob:
        - "*/commands/*.md"
        - "*/skills/*.md"
        - "*/skills/*/*.md"
        - "*/agents/*.md"
        - "*/hooks/*.md"
        - ".claude/commands/*.md"
        - ".claude/skills/*.md"
        - ".claude/rules/*.md"
      run: bun ./scripts/validate-frontmatter.ts

    # The six gates below run over the whole repo, not the staged subset: each
    # takes well under a second, and CI then replays the exact same commands.
    - name: lint-config
      glob:
        - "oxlint.config.ts"
        - "scripts/check-lint-config.ts"
        - "scripts/check-lint-config.test.ts"
        - "tools/oxlint/lint-contract.json"
        - "tools/oxlint/CHECKSUMS.sha256"
        - "tools/oxlint/anti-slop/**"
        - ".github/workflows/ci.yml"
        - "lefthook.yml"
      run: bun ./scripts/check-lint-config.ts
    - name: typecheck
      glob:
        - "*.ts"
        - "*.tsx"
        - "tsconfig.json"
      run: bun x tsgo --noEmit
    - name: lint-ts
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.mjs"
        - "*.cjs"
        - "oxlint.config.ts"
      run: bun x oxlint
    - name: fmt
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.mjs"
        - "*.cjs"
        - ".oxfmtrc.json"
      run: bun x oxfmt --check '**/*.ts' '**/*.tsx' '**/*.js' '**/*.mjs' '**/*.cjs'
    - name: lint-sh
      glob:
        - "*.sh"
        - "*/scripts/*"
        - "*/hooks/*"
        - ".claude/git/*"
      run: bun ./scripts/lint-shell.ts
    - name: check-lint-disables
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.mjs"
        - "*.cjs"
      run: bun ./scripts/check-lint-disables.ts
    # The engine reads the hooks module's source and reports what it hooks and
    # calls; the flag is needed until function hooks ship publicly.
    - name: validate-vellum
      glob:
        - "vellum/hooks/*"
        - "vellum/.claude-plugin/*"
      run: CLAUDE_CODE_ENABLE_FUNCTION_HOOKS=1 claude plugin validate vellum

commit-msg:
  jobs:
    - name: block-ai-signatures
      run: ./.claude/git/block-ai-signatures.sh {1}

# The net before a push: pre-commit runs a gate only when a staged path matches
# its glob, and runs no test.
# A script job, not a run job: lefthook 2.1.12 skips a pre-push run job when
# `git diff HEAD @{push}` lists no file, and fails it when the branch has no
# upstream and origin/HEAD names no local branch.
pre-push:
  jobs:
    - name: gates-and-tests
      script: gates-and-tests.sh
