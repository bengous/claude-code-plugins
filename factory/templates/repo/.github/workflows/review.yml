name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  merge_group:
# A push cancels the review of the commit it replaces, so a stale run posts nothing.
concurrency:
  group: review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  read:
    name: review (read)
    # A draft is reviewed once, when it becomes ready.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Read access alone: this job hands the pull request's text to a model.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    outputs:
      verdict: ${{ steps.review.outputs.structured_output }}
      outside: ${{ steps.change.outputs.outside }}
      self: ${{ steps.change.outputs.self }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Read what the pull request changes
        id: change
        run: |
          set -euo pipefail
          # No globbing: a listed path is compared as text, never expanded by the shell.
          set -f
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          # The list is optional: a repository without it gets the normal depth everywhere.
          sensitive=$(gh api "repos/$REPO/contents/.github/deep-review-paths?ref=$BASE" --jq .content 2>/dev/null | base64 -d | awk '!/^#/ && NF {print $1}' || true)
          owned=$(gh api "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE" --jq .content 2>/dev/null | base64 -d | awk '!/^#/ && NF {print $1}' || true)
          effort=high
          deep=""
          outside=0
          while IFS= read -r f; do
            for p in $sensitive; do
              case "/$f" in "$p"*) effort=xhigh; deep="--deep " ;; esac
            done
            held=0
            for p in $owned; do
              case "/$f" in "$p"*) held=1 ;; esac
            done
            if [ "$held" -eq 0 ]; then outside=$((outside + 1)); fi
          done <<<"$files"
          {
            echo "effort=$effort"
            echo "target=$deep$REPO/pull/$PR"
            echo "outside=$outside"
            echo "self=$(grep -cx '\.github/workflows/review\.yml' <<<"$files" || true)"
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review --comment ${{ steps.change.outputs.target }}"
          claude_args: |
            --model claude-opus-5-5
            --effort ${{ steps.change.outputs.effort }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"findings":{"type":"integer","minimum":0}},"required":["findings"]}'
  review:
    needs: read
    # The merge queue requires every required check on its merge group; a skipped job reports success.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # The label and the comment of the round cap need write access, which no model gets: this job runs none.
    permissions:
      contents: read
      checks: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      OWNER: {{OWNER}}
      VERDICT: ${{ needs.read.outputs.verdict }}
      OUTSIDE: ${{ needs.read.outputs.outside }}
      SELF: ${{ needs.read.outputs.self }}
    steps:
      # The author's session can resolve a review thread it declines, so the thread rule alone does not hold a finding.
      - name: Fail while the review has findings, and stop at the third failed round
        run: |
          set -euo pipefail
          # claude-code-action skips itself when this file differs from {{BRANCH}}. Only a pull request that stays
          # inside the paths of CODEOWNERS goes through unreviewed: the owner gate holds it for the owner.
          if [ -z "$VERDICT" ] && [ "${SELF:-0}" -gt 0 ]; then
            if [ "${OUTSIDE:-1}" -eq 0 ]; then
              echo "::notice::Not reviewed: this pull request changes the review workflow."
              exit 0
            fi
            echo "::error::This pull request changes the review workflow and files outside the paths of CODEOWNERS: the review cannot run on it. Split it."
            exit 1
          fi
          findings=$(jq -er .findings <<<"$VERDICT")
          echo "Review: $findings finding(s)." >> "$GITHUB_STEP_SUMMARY"
          # A failed round is a commit of the pull request on which review or test failed. The count starts again
          # when the owner removes needs-human; a removal made through an app does not count.
          since=$(gh api --paginate "repos/$REPO/issues/$PR/events?per_page=100" \
            --jq ".[] | select(.event == \"unlabeled\" and .label.name == \"needs-human\" and .performed_via_github_app == null and .actor.login == \"$OWNER\") | .created_at" | tail -n1)
          commits=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" --jq '.[].sha')
          # This commit counts when the review has a finding, or when its test already failed. Every earlier
          # one counts whatever this one gives: a test that fails after its review ended is counted by the next push.
          rounds=0
          while IFS= read -r sha; do
            if [ "$sha" = "$HEAD" ]; then continue; fi
            red=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq "[.check_runs[] | select((.name == \"review\" or .name == \"test\") and .conclusion == \"failure\" and .completed_at > \"$since\")] | length")
            if [ "$red" -gt 0 ]; then rounds=$((rounds + 1)); fi
          done <<<"$commits"
          this=0
          if [ "$findings" -gt 0 ]; then
            this=1
          else
            this=$(gh api "repos/$REPO/commits/$HEAD/check-runs?check_name=test&per_page=100" \
              --jq "[.check_runs[] | select(.conclusion == \"failure\" and .completed_at > \"$since\")] | length | if . > 0 then 1 else 0 end")
          fi
          rounds=$((rounds + this))
          echo "Failed rounds since the owner last removed needs-human: $rounds." >> "$GITHUB_STEP_SUMMARY"
          if [ "$rounds" -ge 3 ]; then
            labels=$(gh api "repos/$REPO/issues/$PR/labels" --paginate --jq '.[].name')
            if ! grep -qx needs-human <<<"$labels"; then
              gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=needs-human" --silent
              for issue in $(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences --jq '.closingIssuesReferences[].number'); do
                gh api -X POST "repos/$REPO/issues/$issue/labels" -f "labels[]=needs-human" --silent
              done
              gh api -X POST "repos/$REPO/issues/$PR/comments" --silent \
                -f body="Third failed round: \`review\` or \`test\` failed on $rounds commits of this pull request. The factory stops here and labels it \`needs-human\`. @$OWNER: comment what to do, then remove the label. The count starts again from there."
            fi
            echo "::error::Third failed round: needs-human. $OWNER comments what to do and removes the label."
            exit 1
          fi
          if [ "$findings" -gt 0 ]; then
            echo "::error::The review found $findings issue(s). Push a fix: the next review judges it."
            exit 1
          fi
