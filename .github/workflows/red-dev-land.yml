name: red-dev-land

# Lands the red-dev fix task's pull request (`fix/red-dev-<issue>`) on `dev` once CI is green on
# its head and `scripts/landing/tier.ts` reads it `low`: a fast-forward push, never a commit
# (`scripts/ci/red-dev-land.ts`). GitHub runs a `workflow_run` workflow from the default branch,
# `main`, with the repository's secrets: this file and its script take effect with the release that
# carries them, and the code that runs is `main`'s, never the pull request's, whose head is fetched
# as git data alone. The push goes through the agents' GitHub App: a `GITHUB_TOKEN` push starts no
# workflow, and `dev`'s CI push run is what red-dev reads.
on:
  # The code that runs is `main`'s (above); the pull request's head is fetched as git data alone.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: ["fix/red-dev-*"]

# One group per fix branch. GitHub keeps one pending run per group and cancels the older pending one
# whatever `cancel-in-progress` says, so one group for every branch could drop a fix's green
# completion behind another branch's. A pending run that a later one of the same branch replaces
# loses little: the later one reads the pull request afresh. Two branches landing at once race on
# `dev`, and the fast-forward-only push refuses the second.
concurrency:
  group: red-dev-land-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  # No `GITHUB_TOKEN` permission: every read and write goes through the App's token.
  red-dev-land:
    runs-on: ubuntu-latest
    steps:
      - name: Get the agents' App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Full history: `tier.ts` diffs from the merge-base with `origin/dev`. The App token stays in
      # the git config: `red-dev-land.ts` pushes to `dev` with it, and the job uploads no artifact.
      - name: Checkout the default branch # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      # The step of `ci.yml`'s `pin-claude-code` anchor, which an anchor cannot reach across files.
      # It writes to GITHUB_ENV a version read from the default branch's own file.
      - name: Pin Claude Code to the version the types were written by
        shell: bash
        run: | # zizmor: ignore[github-env]
          version=$(sed -n '1s|^// Written by Claude Code \([^ ]*\)\.$|\1|p' vellum/types/claude-code.d.ts)
          if [ -z "$version" ]; then
            echo '::error::vellum/types/claude-code.d.ts: expected "// Written by Claude Code <version>." on line 1.'
            exit 1
          fi
          echo "MISE_CLAUDE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Claude Code $version"

      # mise.toml includes the private bengous/stack-watch registry, which MISE_GITHUB_TOKEN reads.
      - name: Set up tools (bun, claude via mise)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
        with:
          version: 2026.10.25
          install_args: bun claude
          cache_key: "{{default}}-claude-{{env.MISE_CLAUDE_VERSION}}"

      - name: Land the green red-dev fix on dev, or say why not
        run: bun ./scripts/ci/red-dev-land.ts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
