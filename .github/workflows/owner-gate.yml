name: Owner gate
# pull_request_target runs this file as it is on dev, so a PR cannot edit the gate that judges it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
jobs:
  owner-gate:
    # The merge queue requires every required check on its merge group; a skipped job reports success.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      # Re-running the review of a pull request the owner just labeled ready.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      ACTION: ${{ github.event.action }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      OWNER: bengous
    steps:
      # The classifier and the review spend the owner's token, so a move of his starts them. A pull request
      # opened under his login gets both. A dependency update of Renovate, from the configuration he wrote,
      # gets the classifier alone, and the review too once the gate holds it for him. His ready label on a
      # pull request he did not open gets it the review alone, and leaves the merge to him. review.yml reads
      # the same author, commits and label.
      - name: Whose move started this pull request
        id: start
        run: |
          set -euo pipefail
          who=other
          if [ "$AUTHOR" = "$OWNER" ]; then
            who=owner
          elif [ "$AUTHOR" = "renovate[bot]" ]; then
            # Anyone with write access can push to a branch Renovate opened. Renovate commits through
            # GitHub's API, which signs for it: a commit of anyone else makes the pull request someone else's.
            foreign=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" \
              --jq '.[] | select((.author.login == "renovate[bot]" and .committer.login == "web-flow" and .commit.verification.verified == true) | not) | .sha' | wc -l)
            if [ "$foreign" -eq 0 ]; then who=renovate; fi
          fi
          ready=false
          last=$(gh api --paginate "repos/$REPO/issues/$PR/events?per_page=100" \
            --jq '.[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "ready") | "\(.event) \(.performed_via_github_app == null) \(.actor.login)"' | tail -n1)
          if [ "$last" = "labeled true $OWNER" ]; then ready=true; fi
          by=""
          if [ "$who" = owner ]; then
            by=author
          elif [ "$ready" = true ]; then
            by=label
          elif [ "$who" = renovate ]; then
            by=renovate
          fi
          echo "by=$by" >> "$GITHUB_OUTPUT"
      # review.yml runs on no label: the run that left this head unreviewed is run again, and reads the label.
      - name: Have the review read a pull request the owner just labeled ready
        if: github.event.action == 'labeled' && github.event.label.name == 'ready' && steps.start.outputs.by == 'label'
        run: |
          set -euo pipefail
          run=$(gh api "repos/$REPO/actions/workflows/review.yml/runs?head_sha=$HEAD&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then
            echo "::warning::No review run on $HEAD to run again: a push starts one."
            exit 0
          fi
          gh api -X POST "repos/$REPO/actions/runs/$run/rerun" --silent
      - name: A push ends the owner's approval
        if: github.event.action == 'synchronize' || github.event.action == 'reopened'
        run: |
          set -euo pipefail
          # The owner approved the commit that was there, not the ones a push adds.
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --paginate --jq '.[].name')
          if grep -qx human-approved <<<"$labels"; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/human-approved" --silent
          fi
      # A change of base reruns nothing: this check stays red on the head until a push runs it against dev.
      - name: Judge pull requests against dev only
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" != "dev" ]; then
            echo "::error::This pull request's base is not dev: the factory judges pull requests against dev only."
            exit 1
          fi
      # The tier rules alone, from dev: the pull request's code is never checked out, and no file of
      # the repository's root configures the bun that runs tier.ts.
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/factory
            .github/CODEOWNERS
          sparse-checkout-cone-mode: false
      # A step that fails from here to the verdict leaves no tier, which the last step reads as human.
      - uses: oven-sh/setup-bun@v2.2.0
        continue-on-error: true
      - name: Tier of the head commit
        id: tier
        continue-on-error: true
        run: bun .github/factory/tier.ts gate --repo "$REPO" --pr "$PR" --head "$HEAD"
      # A fork's pull request never reaches the classifier: anyone can open one, and each would spend the
      # owner's token on a stranger's text. Nor does one whose tier the last step sets to human whatever a
      # classifier would say: someone else's, labeled ready or not. Either gets no tier, which that step
      # reads as human.
      - name: Install Claude Code
        if: steps.tier.outputs.ask == 'true' && (steps.start.outputs.by == 'author' || steps.start.outputs.by == 'renovate') && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code
      - name: Ask the classifier, once per commit and diff
        id: judge
        if: steps.tier.outputs.ask == 'true' && (steps.start.outputs.by == 'author' || steps.start.outputs.by == 'renovate') && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bun .github/factory/tier.ts gate --repo "$REPO" --pr "$PR" --head "$HEAD" --ask
      # A Renovate update the owner approves or merges by hand is read first: one the tier holds, and a major,
      # which renovate.json leaves for him to merge, whatever its tier. The step marks the head, which
      # review.yml reads, and runs its review again if that run started before the mark. It waits for the
      # review to end: a run started again keeps its earlier green `Not reviewed` until it reports, and this
      # check stays pending until then, so no approval and no merge lands on a head the review did not read.
      - name: Have the review read a Renovate update held for the owner
        if: steps.start.outputs.by == 'renovate'
        env:
          TIER: ${{ steps.judge.outputs.tier || steps.tier.outputs.tier }}
          SUPERSEDED: ${{ steps.judge.outputs.superseded || steps.tier.outputs.superseded }}
        run: |
          set -euo pipefail
          # A run the pull request moved past leaves the review to the run of its new head.
          moved() {
            [ "$SUPERSEDED" = true ] || [ "$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)" != "$HEAD" ]
          }
          if moved; then exit 0; fi
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --paginate --jq '.[].name')
          if [ "$TIER" = low ] && ! grep -qx major <<<"$labels"; then
            echo "Not held: tier low, and no major."
            exit 0
          fi
          marks=$(gh api "repos/$REPO/commits/$HEAD/check-runs?check_name=held%20for%20the%20owner&per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | length')
          if [ "$marks" -eq 0 ]; then
            gh api -X POST "repos/$REPO/check-runs" --silent \
              -f name="held for the owner" -f head_sha="$HEAD" -f status=completed -f conclusion=neutral \
              -f "output[title]=Held for $OWNER: the review reads it" \
              -f "output[summary]=The owner gate holds this Renovate update for $OWNER, so review.yml reads it before he approves or merges it."
          fi
          deadline=$((SECONDS + 2700))
          appear=$((SECONDS + 120))
          run=""
          while [ -z "$run" ]; do
            run=$(gh api "repos/$REPO/actions/workflows/review.yml/runs?head_sha=$HEAD&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            if [ -n "$run" ]; then break; fi
            if [ "$SECONDS" -ge "$appear" ]; then
              echo "::error::No review run on $HEAD to have it read the update: a push starts one."
              exit 1
            fi
            sleep 15
          done
          # Waits until the run's attempt is at least the one given and has ended.
          ended() {
            local at
            while true; do
              at=$(gh api "repos/$REPO/actions/runs/$run" --jq '"\(.run_attempt) \(.status)"')
              if [ "${at% *}" -ge "$1" ] && [ "${at#* }" = completed ]; then return 0; fi
              if moved; then exit 0; fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::The review of $HEAD did not end in 45 minutes: run the owner gate again once it has."
                exit 1
              fi
              sleep 15
            done
          }
          # The reviewer's step, skipped when the run decided before the mark that no move started it.
          reviewer() {
            gh api "repos/$REPO/actions/runs/$run/jobs" \
              --jq '[.jobs[] | select(.name == "review (read)") | .steps[] | select(.name | startswith("Run anthropics/claude-code-action")) | .conclusion] | last // "none"'
          }
          ended 1
          if [ "$(reviewer)" = skipped ]; then
            attempt=$(gh api "repos/$REPO/actions/runs/$run" --jq .run_attempt)
            # Another run of this gate may have started it again first: GitHub refuses a second start, and
            # this run waits for that one's attempt.
            if gh api -X POST "repos/$REPO/actions/runs/$run/rerun" --silent; then
              ended $((attempt + 1))
            else
              ended "$(gh api "repos/$REPO/actions/runs/$run" --jq .run_attempt)"
            fi
          fi
          verdict=$(reviewer)
          if moved; then exit 0; fi
          if [ "$verdict" = skipped ] || [ "$verdict" = none ]; then
            echo "::error::The review did not read $HEAD, which the gate holds for $OWNER: run it again."
            exit 1
          fi
          echo "The review read $HEAD: its verdict is on the review check."
      - name: Hold a human change until the owner labels it human-approved
        env:
          TIER: ${{ steps.judge.outputs.tier || steps.tier.outputs.tier }}
          REASON: ${{ steps.judge.outputs.reason || steps.tier.outputs.reason }}
          SUPERSEDED: ${{ steps.judge.outputs.superseded || steps.tier.outputs.superseded }}
          BY: ${{ steps.start.outputs.by }}
        run: |
          set -euo pipefail
          # The labels show the tier of the head commit. A push can land while the classifier answers, so the
          # head is read again here: a run the pull request moved past touches no label.
          current=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$SUPERSEDED" = true ] || [ "$current" != "$HEAD" ]; then
            echo "::error::The pull request moved past this commit: the run of its new head judges it."
            exit 1
          fi
          tier=human
          stale=tier:low
          # A pull request no move of the owner started was read by no review: it is the owner's, whatever
          # tier an earlier head of it was given.
          # His ready label buys a pull request he did not open a review to decide on, and no merge: the
          # review it runs again reports after this check, and until then the head still carries the green
          # `Not reviewed`, which a low tier would let auto-merge through unread.
          case "$BY" in
            author | renovate) ;;
            label)
              TIER=human
              REASON="$OWNER did not open this pull request: his ready label has it reviewed, and he approves it"
              ;;
            *)
              TIER=human
              REASON="no move of $OWNER started this pull request, which no review read"
              ;;
          esac
          if [ "$TIER" = low ]; then
            tier=low
            stale=tier:human
          fi
          # The label shows the tier; no check reads it.
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --paginate --jq '.[].name')
          if ! grep -qx "tier:$tier" <<<"$labels"; then
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=tier:$tier" --silent
          fi
          if grep -qx "$stale" <<<"$labels"; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/$stale" --silent
          fi
          if [ "$tier" = low ]; then
            echo "Tier low: $REASON"
            exit 0
          fi
          echo "Tier human: ${REASON:-no tier was computed, after a failed step or for a pull request from a fork}"
          # An agent acts with the owner's account but through the Claude GitHub App; only a label added without an app counts.
          last=$(gh api --paginate "repos/$REPO/issues/$PR/events?per_page=100" \
            --jq '.[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "human-approved") | "\(.event) \(.performed_via_github_app == null) \(.actor.login)"' | tail -n1)
          if [ "$last" = "labeled true $OWNER" ]; then
            echo "Approved by $OWNER."
            exit 0
          fi
          echo "::error::Tier human: $OWNER adds the human-approved label, which holds for this commit alone."
          exit 1
