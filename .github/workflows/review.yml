name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  merge_group:
# A push cancels the review of the commit it replaces, so a stale run posts nothing.
concurrency:
  group: review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  read:
    name: review (read)
    # A draft is reviewed once, when it becomes ready. A pull request against another base is not reviewed.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    # Read access, and an OIDC token for claude-code-action: this job hands the pull request's text to a model.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    outputs:
      verdict: ${{ steps.review.outputs.structured_output }}
      outside: ${{ steps.change.outputs.outside }}
      self: ${{ steps.change.outputs.self }}
      started: ${{ steps.start.outputs.started }}
      who: ${{ steps.start.outputs.who }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      OWNER: bengous
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 1
      # The review spends the owner's token, so a move of his starts it: a pull request opened under his
      # login, by his own session or the one his ready label started on an issue, or any other once he
      # labels it ready, with no app behind the label. A dependency update of Renovate is not read unless
      # he asks: a review that runs no code adds little to a manifest and a lockfile, which test and the
      # tier judge.
      - name: Whose move started this pull request
        id: start
        run: |
          set -euo pipefail
          who=other
          if [ "$AUTHOR" = "$OWNER" ]; then
            who=owner
          elif [ "$AUTHOR" = "renovate[bot]" ]; then
            # Anyone with write access can push to a branch Renovate opened. Renovate commits through
            # GitHub's API, which signs for it: a commit of anyone else makes the pull request someone else's.
            foreign=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" \
              --jq '.[] | select((.author.login == "renovate[bot]" and .committer.login == "web-flow" and .commit.verification.verified == true) | not) | .sha' | wc -l)
            if [ "$foreign" -eq 0 ]; then who=renovate; fi
          fi
          ready=false
          last=$(gh api --paginate "repos/$REPO/issues/$PR/events?per_page=100" \
            --jq '.[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "ready") | "\(.event) \(.performed_via_github_app == null) \(.actor.login)"' | tail -n1)
          if [ "$last" = "labeled true $OWNER" ]; then ready=true; fi
          started=false
          if [ "$who" = owner ] || [ "$ready" = true ]; then started=true; fi
          {
            echo "who=$who"
            echo "started=$started"
          } >> "$GITHUB_OUTPUT"
      - name: Read what the pull request changes
        id: change
        run: |
          set -euo pipefail
          # No globbing: a listed path is compared as text, never expanded by the shell.
          set -f
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          # The list is optional: a repository without it gets the normal depth everywhere.
          sensitive=$(gh api "repos/$REPO/contents/.github/deep-review-paths?ref=$BASE" --jq .content 2>/dev/null | base64 -d | awk '!/^#/ && NF {print $1}' || true)
          owned=$(gh api "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE" --jq .content 2>/dev/null | base64 -d | awk '!/^#/ && NF {print $1}' || true)
          effort=high
          deep=""
          outside=0
          while IFS= read -r f; do
            for p in $sensitive; do
              case "/$f" in "$p"*) effort=xhigh; deep="--deep " ;; esac
            done
            held=0
            for p in $owned; do
              case "/$f" in "$p"*) held=1 ;; esac
            done
            if [ "$held" -eq 0 ]; then outside=$((outside + 1)); fi
          done <<<"$files"
          {
            echo "effort=$effort"
            echo "target=$deep$REPO/pull/$PR"
            echo "outside=$outside"
            echo "self=$(grep -cx '\.github/workflows/review\.yml' <<<"$files" || true)"
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1.0.289
        id: review
        if: steps.start.outputs.started == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses a pull request a bot opened unless the bot is named here.
          allowed_bots: renovate
          prompt: "/pr-review --comment ${{ steps.change.outputs.target }}"
          # The repository's settings are a workstation's: SessionStart hooks that start headless runs, and an
          # allow-list that lets a session fetch and run code. Neither belongs in a job that reads a pull
          # request's text with a token in its environment: the hooks are off, and those tools are denied.
          claude_args: |
            --model claude-opus-5-5
            --effort ${{ steps.change.outputs.effort }}
            --settings '{"disableAllHooks":true}'
            --disallowedTools "WebSearch" "WebFetch" "Bash(curl:*)" "Bash(node:*)" "Bash(npm:*)" "Bash(npx:*)" "Bash(pnpm:*)" "Bash(pnpx:*)" "Bash(bun:*)"
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"findings":{"type":"integer","minimum":0}},"required":["findings"]}'
  review:
    needs: read
    # The merge queue requires every required check on its merge group; a skipped job reports success. On a
    # draft the job runs and fails: skipped, it would read green on a head no round has read, and stay the
    # head's verdict from the moment the draft is marked ready until its review ends.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # The label and the comment of the round cap need write access, which no model gets: this job runs none.
    permissions:
      contents: read
      checks: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      OWNER: bengous
      VERDICT: ${{ needs.read.outputs.verdict }}
      OUTSIDE: ${{ needs.read.outputs.outside }}
      SELF: ${{ needs.read.outputs.self }}
      STARTED: ${{ needs.read.outputs.started }}
      WHO: ${{ needs.read.outputs.who }}
    steps:
      - name: Hold a draft, which no round reads
        if: github.event.pull_request.draft == true
        run: |
          echo "::error::A draft is not reviewed. Mark it ready: the review then reads it."
          exit 1
      # A change of base reruns nothing: this check stays red on the head until a push runs it against dev.
      - name: Judge pull requests against dev only
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" != "dev" ]; then
            echo "::error::This pull request's base is not dev: the factory judges pull requests against dev only."
            exit 1
          fi
      - name: Hold a pull request the factory stopped
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --paginate --jq '.[].name')
          if grep -qx needs-human <<<"$labels"; then
            echo "::error::needs-human: the factory stopped this pull request. $OWNER comments what to do and removes the label."
            exit 1
          fi
      # The author's session can resolve a review thread it declines, so the thread rule alone does not hold a finding.
      - name: Fail while the review has findings, and stop at the third failed round
        run: |
          set -euo pipefail
          # No move of the owner started it, so no round read it: the owner gate holds it for the owner,
          # whatever its change.
          if [ "$STARTED" = false ]; then
            if [ "$WHO" = renovate ]; then
              echo "::notice::Not reviewed: a dependency update of Renovate, which test and the tier judge. $OWNER labels it ready to have it reviewed."
            else
              echo "::notice::Not reviewed: no move of $OWNER started this pull request. He labels it ready to have it reviewed."
            fi
            exit 0
          fi
          # claude-code-action skips itself when this file differs from dev. Only a pull request that stays
          # inside the paths of CODEOWNERS goes through unreviewed: the owner gate holds it for the owner.
          if [ -z "$VERDICT" ] && [ "${SELF:-0}" -gt 0 ]; then
            if [ "${OUTSIDE:-1}" -eq 0 ]; then
              echo "::notice::Not reviewed: this pull request changes the review workflow."
              exit 0
            fi
            echo "::error::This pull request changes the review workflow and files outside the paths of CODEOWNERS: the review cannot run on it. Split it."
            exit 1
          fi
          findings=$(jq -er .findings <<<"$VERDICT")
          echo "Review: $findings finding(s)." >> "$GITHUB_STEP_SUMMARY"
          # A failed round is a commit of the pull request on which review or test failed. The count starts again
          # when the owner restarts a stopped pull request: he comments what to do and removes needs-human.
          # GitHub records the app behind a comment and behind a label added, not behind a label removed, so the
          # author's session can remove the label under the owner's login. The removal counts only with a
          # comment the owner wrote himself since the stop.
          events=$(gh api --paginate "repos/$REPO/issues/$PR/events?per_page=100" \
            --jq '.[] | select(.label.name == "needs-human") | "\(.event) \(.actor.login) \(.created_at)"')
          stopped=$(awk '$1 == "labeled" {print $3}' <<<"$events" | tail -n1)
          removed=$(awk -v owner="$OWNER" '$1 == "unlabeled" && $2 == owner {print $3}' <<<"$events" | tail -n1)
          since=""
          if [ -n "$removed" ] && [[ "$removed" > "$stopped" ]]; then
            said=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"$OWNER\" and .performed_via_github_app == null and .created_at > \"$stopped\") | .created_at" | tail -n1)
            if [ -n "$said" ]; then since=$removed; fi
          fi
          commits=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" --jq '.[].sha')
          # This commit counts when the review has a finding, or when its test already failed. Every earlier
          # one counts whatever this one gives: a test that fails after its review ended is counted by the next push.
          rounds=0
          while IFS= read -r sha; do
            if [ "$sha" = "$HEAD" ]; then continue; fi
            # A red review counts when its run read the commit. On a draft, and against another base, this job
            # fails with `review (read)` skipped: no round judged that head, and a branch pushed three times as
            # a draft would be stopped the moment it is marked ready. A workflow run is one check suite, which
            # keeps every attempt of a job: the last attempt speaks, so a red job re-run green is no round.
            red=$(gh api --paginate --slurp "repos/$REPO/commits/$sha/check-runs?filter=all&per_page=100" \
              | jq --arg since "$since" '[.[].check_runs[] | select(.completed_at != null)] as $runs
                | def ended($name):
                    [$runs[] | select(.name == $name)] | group_by(.check_suite.id) | map(max_by(.completed_at));
                  [ended("review (read)")[] | select(.conclusion == "success") | .check_suite.id] as $read
                | [ended("test")[], (ended("review")[] | select(.check_suite.id as $suite | any($read[]; . == $suite)))]
                | map(select(.conclusion == "failure" and .completed_at > $since))
                | length')
            if [ "$red" -gt 0 ]; then rounds=$((rounds + 1)); fi
          done <<<"$commits"
          this=0
          if [ "$findings" -gt 0 ]; then
            this=1
          else
            this=$(gh api "repos/$REPO/commits/$HEAD/check-runs?check_name=test&per_page=100" \
              --jq "[.check_runs[] | select(.conclusion == \"failure\" and .completed_at > \"$since\")] | length | if . > 0 then 1 else 0 end")
          fi
          rounds=$((rounds + this))
          echo "Failed rounds since the owner last removed needs-human: $rounds." >> "$GITHUB_STEP_SUMMARY"
          # A force-push drops the earlier commits from the pull request, and the failed rounds counted on them:
          # the count cannot hold, so a force-push since the owner's last restart stops the pull request too.
          # Renovate's own are left out: it keeps its branch on its base by writing its one commit again, and
          # no session counts rounds on a pull request it opened.
          forced=$(gh api --paginate "repos/$REPO/issues/$PR/events?per_page=100" \
            --jq ".[] | select(.event == \"head_ref_force_pushed\" and .actor.login != \"renovate[bot]\" and .created_at > \"$since\") | .created_at" | wc -l)
          stop=""
          if [ "$forced" -gt 0 ]; then
            stop="The branch was force-pushed, which drops the commits the failed rounds are counted on."
          elif [ "$rounds" -ge 3 ]; then
            stop="Third failed round: \`review\` or \`test\` failed on $rounds commits of this pull request."
          fi
          if [ -n "$stop" ]; then
            labels=$(gh api "repos/$REPO/issues/$PR/labels" --paginate --jq '.[].name')
            if ! grep -qx needs-human <<<"$labels"; then
              gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=needs-human" --silent
              issues=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
              for issue in $issues; do
                gh api -X POST "repos/$REPO/issues/$issue/labels" -f "labels[]=needs-human" --silent
              done
              gh api -X POST "repos/$REPO/issues/$PR/comments" --silent \
                -f body="$stop The factory stops here and labels it \`needs-human\`. @$OWNER: comment what to do, then remove the label. The count starts again from there."
            fi
            echo "::error::needs-human: the factory stopped this pull request. $OWNER comments what to do and removes the label."
            exit 1
          fi
          if [ "$findings" -gt 0 ]; then
            echo "::error::The review found $findings issue(s). Push a fix: the next review judges it."
            exit 1
          fi
