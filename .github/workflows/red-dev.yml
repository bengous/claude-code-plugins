name: red-dev

# While `dev`'s head is red in CI, one open issue labelled `red-dev` says so (`scripts/ci/red-dev.ts`).
# Each CI run that completes on `dev` wakes it; it decides from `dev`'s head alone, read fresh, so
# runs that end out of order reach the head's verdict. GitHub runs a `workflow_run` workflow from
# the default branch, `main`: this file and its script take effect with the release that carries
# them.
on:
  # The job checks out and runs the default branch's code, never the code of the run that woke it.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [dev]

# One run at a time, none cancelled: a pending run replaced by a newer one loses nothing, since
# each reads the head afresh.
concurrency:
  group: red-dev
  cancel-in-progress: false

permissions: {}

jobs:
  red-dev:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools (bun via mise)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: bun

      - name: Open, comment on or close the red-dev issue from dev's head
        run: bun ./scripts/ci/red-dev.ts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
