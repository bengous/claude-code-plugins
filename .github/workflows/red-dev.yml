name: red-dev

# While `dev`'s head is red in CI, one open issue labelled `red-dev` says so (`scripts/red-dev.ts`).
# Each CI run that completes on `dev` wakes it; it decides from `dev`'s head alone, read fresh, so
# runs that end out of order reach the head's verdict. GitHub runs a `workflow_run` workflow from
# the default branch, `main`: this file and its script take effect with the release that carries
# them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

# One run at a time, none cancelled: a pending run replaced by a newer one loses nothing, since
# each reads the head afresh.
concurrency:
  group: red-dev
  cancel-in-progress: false

permissions: {}

jobs:
  red-dev:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up tools (bun via mise)
        uses: jdx/mise-action@v5
        with:
          install_args: bun

      - name: Open, comment on or close the red-dev issue from dev's head
        run: bun ./scripts/red-dev.ts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
