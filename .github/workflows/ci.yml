name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled]
  # `main` is included so a ref update that bypasses the PR path still gets
  # validated server-side. Without it, anything landing on main directly runs
  # no checks at all. `renovate/**` because Renovate's branch automerge has no pull request: it
  # fast-forwards `dev` only once it reads green check runs on the branch's own head.
  push:
    branches: [dev, main, "renovate/**"]
  workflow_dispatch:

permissions:
  contents: read

# `e2e` runs on request only: the `e2e` label on a pull request, or a dispatch. The label
# works on a pull request from this repository alone: a fork's gets a read-only token,
# which cannot take the label off. No concurrency group: a request never cancels another.
jobs:
  # No job `if:`, whatever the label: a job an `if:` skips reports success to a required check,
  # and `main` requires `validate`, so a skipped one beside a red one could hide it. A pull
  # request's run is scoped by its steps instead, and named apart: only a push or a dispatch runs
  # every suite and kit, under the name `main` requires.
  validate:
    name: ${{ github.event_name == 'pull_request' && 'validate (scoped)' || 'validate' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history needed for the drift guard

      # The hooks module's kit needs the engine its types were written by. An exact version,
      # unlike `latest`, is neither left where the action's cache first resolved it nor held
      # back by mise's minimum release age, so a types update is tested on its own engine.
      - &pin-claude-code
        name: Pin Claude Code to the version the types were written by
        shell: bash
        run: |
          version=$(sed -n '1s|^// Written by Claude Code \([^ ]*\)\.$|\1|p' vellum/types/claude-code.d.ts)
          if [ -z "$version" ]; then
            echo '::error::vellum/types/claude-code.d.ts: expected "// Written by Claude Code <version>." on line 1.'
            exit 1
          fi
          echo "MISE_CLAUDE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Claude Code $version"

      # The default key ignores the pinned version: a hit would restore another build, and an
      # exact hit is never saved again.
      - name: Set up tools (bun, lefthook, shellcheck, shfmt via mise)
        uses: jdx/mise-action@v5.2.2
        with:
          cache_key: &claude-cache-key "{{default}}-claude-{{env.MISE_CLAUDE_VERSION}}"

      - name: Install script dependencies
        run: bun install --frozen-lockfile

      # The vellum plugin carries its own runtime dependencies (react, zustand, remark),
      # installed the way Claude Code installs them at the plugin's cache.
      - name: Install vellum dependencies
        run: bun install --cwd vellum --frozen-lockfile --ignore-scripts

      # pinpoint's server bundles snapdom into its overlay, so its suites build with it.
      - name: Install pinpoint dependencies
        run: bun install --cwd pinpoint --frozen-lockfile --ignore-scripts

      # atlas's page imports elkjs and libavoid-js, and its server answers libavoid.wasm from the
      # installed package, so its suites and the typecheck read them.
      - name: Install atlas dependencies
        run: bun install --cwd atlas --frozen-lockfile --ignore-scripts

      # What the change reaches (`scripts/affected.ts`): a pull request's against its base, every
      # suite and kit on any other event. The steps below read `kits`, never interpolate it.
      - name: Scope the suites and kits to the change
        id: scope
        run: bun ./scripts/affected.ts github-output

      # The suites the change reaches, `scripts/` always; on a push or a dispatch every one, the
      # repo's own hooks in a run of their own, since `bun test` skips dot directories. Each run
      # retries the files whose tests failed once (`scripts/flaky-report.ts`), for `flaky`.
      - name: Run test suites
        run: bun ./scripts/affected.ts test --retry validate

      # The eight gates below are the same commands the pre-commit jobs run, so a
      # `--no-verify` commit gets the identical verdict here.
      - name: Check lint configuration
        run: bun ./scripts/check-lint-config.ts

      - name: Typecheck (tsgo)
        run: bun x tsgo --noEmit

      - name: Check that the typecheck covers every tracked TypeScript file
        run: bun ./scripts/check-typecheck-coverage.ts

      - name: Lint TypeScript (oxlint)
        run: bun x oxlint

      - name: Check formatting (oxfmt)
        run: bun x oxfmt --check '**/*.ts' '**/*.tsx' '**/*.js' '**/*.mjs' '**/*.cjs'

      - name: Lint shell (shellcheck + shfmt)
        run: bun ./scripts/lint-shell.ts

      - name: Refuse unjustified lint suppressions
        run: bun ./scripts/check-lint-disables.ts

      - name: Check that each rule names its control
        run: bun ./scripts/check-rule-registry.ts

      # Replays the local pre-commit checks server-side, so a `--no-verify`
      # commit can't slip a version desync or bad frontmatter past review.
      - name: Validate marketplace (version + structure sync)
        run: bun ./scripts/validate-marketplace.ts

      - name: Validate plugin frontmatter
        run: bun ./scripts/validate-frontmatter.ts --all

      - name: Validate the vellum hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'vellum')
        run: claude plugin validate vellum

      - name: Test the vellum hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'vellum')
        run: claude plugin test vellum

      - name: Validate the todos hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'todos')
        run: claude plugin validate todos

      - name: Test the todos hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'todos')
        run: claude plugin test todos

      - name: Validate the secret-pane hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'secret-pane')
        run: claude plugin validate secret-pane

      - name: Test the secret-pane hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'secret-pane')
        run: claude plugin test secret-pane

      - name: Validate the pinpoint hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'pinpoint')
        run: claude plugin validate pinpoint

      - name: Test the pinpoint hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'pinpoint')
        run: claude plugin test pinpoint

      - name: Validate the atlas hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'atlas')
        run: claude plugin validate atlas

      - name: Test the atlas hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'atlas')
        run: claude plugin test atlas

      - name: Validate the griller hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'griller')
        run: claude plugin validate griller

      - name: Test the griller hooks module
        if: contains(fromJSON(steps.scope.outputs.kits), 'griller')
        run: claude plugin test griller

      # main is a delayed fast-forward pointer on dev's history: releases move it
      # with `git push origin dev:main`. Fail loudly if main ever leaves that line.
      - name: Guard main as a strict prefix of dev
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor origin/main origin/dev; then
            echo "::error::main is not an ancestor of dev — main must stay a fast-forward prefix of dev."
            exit 1
          fi
          echo "main is an ancestor of dev: $(git rev-parse origin/main)"

      # A name per attempt: a re-run keeps the first attempt's report beside its own.
      - name: Upload the flaky report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: flaky-validate-${{ github.run_attempt }}
          path: flaky-reports/*.json
          if-no-files-found: ignore

  # On a pull request, what the change reaches, for `win32 (scoped)`. `affected.ts` imports
  # nothing `bun install` brings, so the job installs bun alone.
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.scope.outputs.all }}
      units: ${{ steps.scope.outputs.units }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the merge-base with the pull request's base

      - name: Set up tools (bun via mise)
        uses: jdx/mise-action@v5.2.2
        with:
          install_args: bun

      - name: Scope the suites and kits to the change
        id: scope
        run: bun ./scripts/affected.ts github-output

  # Vellum on Windows: its `bun:test` suites and the hooks module's kit, where Linux misses what
  # Windows refuses (a folder a process holds cannot be renamed). A pull request that does not
  # reach `vellum/` skips it: `main` does not require `win32` today
  # (`docs/repo-ops/protections.md`), and a pull request's run is named `win32 (scoped)`, a name
  # no ruleset requires. `always()` runs it on a push or a dispatch, where `scope` is skipped. The
  # repository's own tooling (`scripts/`, `.claude/hooks`, the shell linters) is not run here.
  # Each suite retries what failed once (`scripts/flaky-report.ts`), and the job uploads what passed
  # on the retry for `flaky`, red or green.
  win32:
    name: ${{ github.event_name == 'pull_request' && 'win32 (scoped)' || 'win32' }}
    needs: scope
    if: >-
      always()
      && (github.event_name != 'pull_request'
      || (needs.scope.result == 'success'
      && (needs.scope.outputs.all == 'true'
      || contains(fromJSON(needs.scope.outputs.units || '[]'), 'vellum'))))
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - *pin-claude-code

      - name: Set up tools (bun, claude via mise)
        uses: jdx/mise-action@v5.2.2
        with:
          install_args: bun claude
          cache_key: *claude-cache-key

      - name: Install script dependencies
        run: bun install --frozen-lockfile

      - name: Install vellum dependencies
        run: bun install --cwd vellum --frozen-lockfile --ignore-scripts

      # Unit and integration suites in one run, on the integration tier's budget (`testRuns` in
      # `scripts/affected.ts`): the job is no required check, and runs vellum's suites alone.
      - name: Run vellum's suites
        run: bun ./scripts/flaky-report.ts retry bun --job win32 -- bun test --parallel --timeout=20000 vellum

      - name: Test the vellum hooks module
        run: bun ./scripts/flaky-report.ts retry kit --job win32 -- claude plugin test vellum

      # A name per attempt: a re-run keeps the first attempt's report beside its own.
      - name: Upload the flaky report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: flaky-win32-${{ github.run_attempt }}
          path: flaky-reports/*.json
          if-no-files-found: ignore

  # Mutation testing on what the change alters in the modules `stryker.config.ts` lists or their
  # tests (`scripts/mutation.ts`): a pull request's, a push's to `dev` since its `before`, so an
  # inline commit is tested and a survivor turns the push run red, a dispatch's since `origin/dev`.
  # A label asks for no new verdict, and a push to `main` releases a `dev` head already tested. A
  # push whose commit has a green `mutation` check from its pull request skips the passes. With
  # nothing to mutate it passes before installing anything. Skipped, the job's check carries this
  # `name:` unrendered, never `mutation`: a label's run cannot stand in for the head's verdict.
  mutation:
    name: ${{ github.event.action == 'labeled' && 'mutation, skipped on a label' || 'mutation' }}
    if: >-
      github.event.action != 'labeled'
      && (github.event_name != 'push' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the merge-base with the base

      - name: Set up tools (bun via mise)
        uses: jdx/mise-action@v5.2.2
        with:
          install_args: bun

      - name: Scope the mutants to the changed lines
        id: scope
        run: bun ./scripts/mutation.ts github-output
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install script dependencies
        if: steps.scope.outputs.mutate == 'true'
        run: bun install --frozen-lockfile

      - name: Mutation-test the changed lines
        if: steps.scope.outputs.mutate == 'true'
        run: bun ./scripts/mutation.ts run

  # Vellum's browser suite, `vellum/e2e/*.e2e.ts`: a job per window of `WINDOWS` in
  # `vellum/e2e/playwright.config.ts`, since it wants a Chromium and takes seconds per file.
  # `scripts/e2e-windows.integration.test.ts` holds the list equal to the config's. `check-e2e-green.ts`
  # reads a running `e2e (<window>)` by that name. `check-lint-config.ts` reads `validate` alone.
  e2e-window:
    name: e2e (${{ matrix.window }})
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'labeled'
      && github.event.label.name == 'e2e'
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      # A red window must not cancel the others: each says something of its own.
      fail-fast: false
      matrix:
        window: [light-1440, dark-1440, light-1024, light-1280, light-1920]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up tools (bun via mise)
        uses: jdx/mise-action@v5.2.2

      - name: Install script dependencies
        run: bun install --frozen-lockfile

      - name: Install vellum dependencies
        run: bun install --cwd vellum --frozen-lockfile --ignore-scripts

      # `--with-deps` adds the system libraries the runner lacks; it wants root, which the
      # runner has and a developer's machine does not, so `e2e:install` leaves it out.
      - name: Install Chromium for Playwright
        run: bunx --bun playwright install --with-deps chromium
        working-directory: vellum

      # 4 workers, not Playwright's default of half the runner's 4 vCPU: measured faster in #194
      # (`docs/repo-ops/checks.md`, Which suite runs on which trigger).
      # Under `CI`, Playwright retries a failed test once (`vellum/e2e/playwright.config.ts`).
      - name: Run the browser suite at one window
        id: suite
        run: bun run --cwd vellum e2e -- --project=${{ matrix.window }} --workers=4

      - name: Record the tests that passed on their retry
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: bun ./scripts/flaky-report.ts playwright --job "e2e (${{ matrix.window }})" vellum/test-results/playwright.json

      - name: Upload the flaky report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: flaky-e2e-${{ matrix.window }}-${{ github.run_attempt }}
          path: flaky-reports/*.json
          if-no-files-found: ignore

  # The browser suite on Windows, at one window: the server, the harness and the page on the
  # platform `e2e-window` never runs. Named `e2e (…)` so `check-e2e-green.ts` counts it among the
  # windows still running. No `--with-deps`: the Windows runner lacks no system library.
  e2e-win32:
    name: e2e (win32, light-1440)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'labeled'
      && github.event.label.name == 'e2e'
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up tools (bun via mise)
        uses: jdx/mise-action@v5.2.2
        with:
          install_args: bun

      - name: Install script dependencies
        run: bun install --frozen-lockfile

      - name: Install vellum dependencies
        run: bun install --cwd vellum --frozen-lockfile --ignore-scripts

      - name: Install Chromium for Playwright
        run: bun run --cwd vellum e2e:install

      - name: Run the browser suite at one window
        id: suite
        run: bun run --cwd vellum e2e -- --project=light-1440 --workers=4

      - name: Record the tests that passed on their retry
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: bun ./scripts/flaky-report.ts playwright --job "e2e (win32, light-1440)" vellum/test-results/playwright.json

      - name: Upload the flaky report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: flaky-e2e-win32-${{ github.run_attempt }}
          path: flaky-reports/*.json
          if-no-files-found: ignore

  # The one check the pre-push gate reads, `scripts/check-e2e-green.ts`: green when every window
  # is, Windows' included. Asked of the same requests as the windows, so a run nobody asked leaves it `skipped`,
  # which the gate reads as no run; `always()` lets a red or cancelled window turn it red.
  e2e:
    needs: [e2e-window, e2e-win32]
    if: >-
      always()
      && (github.event_name == 'workflow_dispatch'
      || (github.event.action == 'labeled'
      && github.event.label.name == 'e2e'
      && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every window passed
        run: |
          if [ "$WINDOWS" != success ] || [ "$WIN32" != success ]; then
            echo "::error::The windows ended ${WINDOWS}, Windows' ${WIN32}; the red one is named among this run's e2e jobs."
            exit 1
          fi
        env:
          WINDOWS: ${{ needs.e2e-window.result }}
          WIN32: ${{ needs.e2e-win32.result }}

  # One issue per flaky test, from the reports the suite jobs uploaded (`scripts/flaky-report.ts`):
  # the one job that writes issues, so the suites' jobs keep the read-only token. It runs after
  # them, red or green, `validate` running on every event, but not on a fork's pull request, whose
  # token cannot write issues.
  # Bookkeeping, never a verdict: every step continues on error, the checkout and the setup too, since
  # the job runs on every event; on the steps rather than the job, since a job's `continue-on-error`
  # still leaves its own check red, which `gh pr checks` and the pull request show. No concurrency group: GitHub cancels a pending job a
  # third one replaces, and a cancelled check refuses a landing; two jobs racing can at worst open
  # one test's issue twice.
  flaky:
    needs: [validate, win32, e2e-window, e2e-win32]
    if: >-
      always()
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v7.0.1

      - name: Set up tools (bun via mise)
        continue-on-error: true
        uses: jdx/mise-action@v5.2.2
        with:
          install_args: bun

      # A folder per artifact, every attempt's: a run already recorded is skipped by its marker.
      - name: Download the flaky reports
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: flaky-*
          path: flaky-reports

      - name: Open, reopen or comment on an issue per flaky test
        continue-on-error: true
        run: bun ./scripts/flaky-report.ts report flaky-reports
        env:
          GH_TOKEN: ${{ github.token }}

  # The label asks for one run: it comes off as that run starts, so the next request is a new
  # label. A job of its own, so the suite's job keeps a read-only token; a re-run of the same
  # run finds the label gone already.
  unlabel:
    if: >-
      github.event.action == 'labeled'
      && github.event.label.name == 'e2e'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Take the e2e label off the pull request
        run: gh api --method DELETE --silent "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/e2e"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
