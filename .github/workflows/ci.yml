name: CI

on:
  pull_request:
    branches: [main, dev]
  # `main` is included so a ref update that bypasses the PR path still gets
  # validated server-side. Without it, anything landing on main directly runs
  # no checks at all.
  push:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history needed for the drift guard

      - name: Set up tools (bun, lefthook, shellcheck, shfmt via mise)
        uses: jdx/mise-action@v4

      - name: Install script dependencies
        run: bun install --frozen-lockfile

      # `bun test` alone skips dot directories, so the repo's own hooks need an
      # explicit path. Together the two runs cover every test file.
      - name: Run test suites
        run: bun test && bun test ./.claude/hooks/*.test.ts

      # The six gates below are the same commands the pre-commit jobs run, so a
      # `--no-verify` commit gets the identical verdict here.
      - name: Check lint configuration
        run: bun ./scripts/check-lint-config.ts

      - name: Typecheck (tsgo)
        run: bun x tsgo --noEmit

      - name: Lint TypeScript (oxlint)
        run: bun x oxlint

      - name: Check formatting (oxfmt)
        run: bun x oxfmt --check '**/*.ts' '**/*.js' '**/*.mjs' '**/*.cjs'

      - name: Lint shell (shellcheck + shfmt)
        run: bun ./scripts/lint-shell.ts

      - name: Refuse unjustified lint suppressions
        run: bun ./scripts/check-lint-disables.ts

      # Replays the local pre-commit checks server-side, so a `--no-verify`
      # commit can't slip a version desync or bad frontmatter past review.
      - name: Validate marketplace (version + structure sync)
        run: bun ./scripts/validate-marketplace.ts

      - name: Validate plugin frontmatter
        run: bun ./scripts/validate-frontmatter.ts --all

      # main is a delayed fast-forward pointer on dev's history: releases move it
      # with `git push origin dev:main`. Fail loudly if main ever leaves that line.
      - name: Guard main as a strict prefix of dev
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor origin/main origin/dev; then
            echo "::error::main is not an ancestor of dev — main must stay a fast-forward prefix of dev."
            exit 1
          fi
          echo "main is an ancestor of dev: $(git rev-parse origin/main)"
